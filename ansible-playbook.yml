- name : Configure Docker on EC2 Instances
  hosts : all
  become: true
  connection : ssh
  tasks : 
  - name: updating apt
    command : sudo apt-get update

  - name : Install Docker
    command : sudo apt-get install -y docker.io
    become : yes
    become_user : root

  - name : Start Docker Service
    command : sudo systemctl start docker
    become : yes
    become_user : root

  - name: Build the Docker image
    command: docker build -t healthCare_docker .

  - name: Tag the Docker image
    command: docker tag healthCare_docker rshinge/healthCare_docker:latest

  - name: Push Docker image to registry
    command: docker push rshinge/healthCare_docker:latest

